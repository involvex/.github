name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the information below.
        If this is a security vulnerability, please see the [Security Policy](SECURITY.md) instead.
  - type: input
    id: environment
    attributes:
      label: "Environment / Package"
      description: The package, platform, or environment where the bug occurs
      placeholder: "e.g., @involvex/core, Node.js 20, Chrome 120"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: A clear and concise description of the bug
      placeholder: "What happened?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: What you expected to happen
      placeholder: "What should have happened?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
      render: bash
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: "Workaround"
      description: Any workaround you found, if applicable
      placeholder: "Did you find a way to work around this?"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: Screenshots, logs, or any other context about the problem
      render: bash
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "Version"
      description: The version where the bug was found (if applicable)
      placeholder: "e.g., v1.2.3"
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: "Issue Checklist"
      options:
        - label: "I have searched for existing issues to avoid duplicates"
          required: true
        - label: "I have provided a minimal, reproducible example"
          required: true
        - label: "I have included version/environment information"
          required: false
        - label: "I have checked the known-issues label for my version"
          required: false
