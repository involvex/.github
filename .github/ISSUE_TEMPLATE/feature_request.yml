name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see.
  - type: input
    id: package
    attributes:
      label: "Package / Area"
      description: Which package or area of the project this feature relates to
      placeholder: "e.g., @involvex/core, CLI, Documentation"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: What problem does this feature solve? What are you trying to do that is currently difficult?
      placeholder: "Describe the problem..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: Describe the solution you'd like
      placeholder: "How should this work?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: Any alternative solutions or features you've considered
      placeholder: "Did you consider other approaches?"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: Screenshots, API designs, links, or other context
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: "Issue Checklist"
      options:
        - label: "I have searched for existing feature requests to avoid duplicates"
          required: true
        - label: "I have provided a clear use case and problem description"
          required: true
        - label: "I have considered the implementation complexity"
          required: false
